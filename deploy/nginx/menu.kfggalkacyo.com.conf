# Maqaaxi Pos — host nginx for menu.kfggalkacyo.com.
#
#   sudo cp deploy/nginx/menu.kfggalkacyo.com.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/menu.kfggalkacyo.com.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d menu.kfggalkacyo.com -d www.kfggalkacyo.com
#
# Install this file FIRST over plain HTTP, then run certbot: it edits this file
# in place, adding the listen 443 / ssl_certificate lines and the port-80
# redirect. Everything below stays as written.
#
# The containers listen on 127.0.0.1 only; this is the single public listener.

upstream maqaaxi_api {
  server 127.0.0.1:4000;
  keepalive 16;
}

upstream maqaaxi_web {
  server 127.0.0.1:3100;
  keepalive 16;
}

# www.kfggalkacyo.com only forwards to the app. Every cookie, the Sifalo return
# URL (PUBLIC_APP_URL) and the QR codes use menu.kfggalkacyo.com, so there is
# one canonical host. certbot adds the 443 listener to this block too (the
# certificate covers both names). The redirect sits in `location /`, not at
# server level, so the ACME challenge below still answers for renewals.
server {
  listen 80;
  listen [::]:80;
  server_name www.kfggalkacyo.com;
  server_tokens off;

  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  location / {
    return 301 https://menu.kfggalkacyo.com$request_uri;
  }
}

# The app. `certbot --nginx` turns this into the TLS server and generates the
# port-80 -> 443 redirect itself — don't hand-write a second port-80 block with
# this server_name, it would collide.
server {
  listen 80;
  listen [::]:80;
  server_name menu.kfggalkacyo.com;

  # Certbot's HTTP-01 challenge, for issuance and every renewal.
  location /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  # Menu item image uploads go through multer; the 1mb express.text limit does
  # not apply to multipart.
  client_max_body_size 12m;

  # Do not advertise the nginx version.
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Add HSTS only once TLS is confirmed working — it is hard to undo:
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # One proxy hop — matches TRUST_PROXY=1 in apps/api/src/app.ts, so the
  # payment rate limits see the real client IP.
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_http_version 1.1;

  # --- Server-Sent Events -------------------------------------------------
  # GET /api/admin/events streams `orders` nudges to the back office. The API
  # already sends X-Accel-Buffering: no, but nginx must also stop buffering and
  # stop timing the stream out, or live order updates die after 60s.
  location = /api/admin/events {
    proxy_pass http://maqaaxi_api;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # --- Payments -----------------------------------------------------------
  # Sifalo waits up to 110s and the API sets server.requestTimeout = 310s.
  # The default 60s proxy timeout would cut a live payment in half.
  location ^~ /api/payment/ {
    proxy_pass http://maqaaxi_api;
    proxy_set_header Connection "";
    proxy_read_timeout 320s;
    proxy_send_timeout 320s;
  }

  location = /api/checkout {
    proxy_pass http://maqaaxi_api;
    proxy_set_header Connection "";
    proxy_read_timeout 320s;
    proxy_send_timeout 320s;
  }

  # --- Everything else on /api -------------------------------------------
  # Menu, auth and the whole back office. nginx routes these straight to the
  # API; Next's own /api rewrite is only a backstop for direct :3100 access.
  location /api/ {
    proxy_pass http://maqaaxi_api;
    proxy_set_header Connection "";
    proxy_read_timeout 75s;
  }

  # --- Next.js ------------------------------------------------------------
  # Including /_next/static, which Next already serves with immutable headers.
  location / {
    proxy_pass http://maqaaxi_web;
    proxy_set_header Connection "";
    proxy_read_timeout 75s;
  }
}
